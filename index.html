<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingo - Gamified Coding Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .neon-btn { background: linear-gradient(135deg, #8a2be2, #00ffff); color: white; transition: 0.3s; }
        .neon-btn:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { color: #00ffff; border-bottom: 2px solid #00ffff; }
    </style>
</head>
<body>
    <nav class="p-6 border-b border-white/10 sticky top-0 bg-black/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black bg-gradient-to-r from-purple-500 to-cyan-500 bg-clip-text text-transparent cursor-pointer" onclick="App.switchPage('home')">CodeLingo</h1>
            <div class="flex gap-6 items-center">
                <div class="nav-item cursor-pointer" onclick="App.switchPage('home')">홈</div>
                <div class="nav-item cursor-pointer" onclick="App.switchPage('problems')">문제</div>
                <div class="nav-item cursor-pointer" onclick="App.switchPage('community')">커뮤니티</div>
                <button id="logout-btn" class="text-gray-400 hover:text-white hidden" onclick="App.handleLogout()">로그아웃</button>
            </div>
        </div>
    </nav>

    <div id="auth-page" class="page active min-h-screen flex items-center justify-center">
        <div class="glass-card p-10 w-full max-w-md">
            <div id="login-form">
                <h2 class="text-3xl font-bold mb-6">로그인</h2>
                <input type="email" id="login-email" placeholder="이메일" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg mb-4">
                <input type="password" id="login-password" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg mb-6">
                <button class="neon-btn w-full py-3 rounded-lg font-bold" onclick="App.handleLogin()">입장하기</button>
                <p class="mt-4 text-center text-gray-400">계정이 없으신가요? <span class="text-cyan-400 cursor-pointer" onclick="App.toggleAuth()">회원가입</span></p>
            </div>
            <div id="signup-form" class="hidden">
                <h2 class="text-3xl font-bold mb-6">회원가입</h2>
                <input type="text" id="signup-username" placeholder="닉네임" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg mb-4">
                <input type="email" id="signup-email" placeholder="이메일" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg mb-4">
                <input type="password" id="signup-password" placeholder="비밀번호" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg mb-6">
                <button class="neon-btn w-full py-3 rounded-lg font-bold" onclick="App.handleSignup()">가입하기</button>
                <p class="mt-4 text-center text-gray-400">이미 계정이 있나요? <span class="text-cyan-400 cursor-pointer" onclick="App.toggleAuth()">로그인</span></p>
            </div>
        </div>
    </div>

    <div id="home" class="page max-w-7xl mx-auto p-8">
        <h2 class="text-4xl font-black mb-10">이번 주 랭킹 🏆</h2>
        <div id="ranking-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            </div>
    </div>

    <div id="community" class="page max-w-5xl mx-auto p-8">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-4xl font-black">개발자 광장</h2>
            <button class="neon-btn px-6 py-2 rounded-full font-bold" onclick="App.openPostModal()">글쓰기</button>
        </div>
        <div id="post-list" class="space-y-6">
            </div>
    </div>

    <script>
        const App = (function() {
            const SUPABASE_URL = 'https://jkkqssclavtzougwomig.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impra3Fzc2NsYXZ0em91Z3dvbWlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY5MzgwMTMsImV4cCI6MjA1MjUxNDAxM30.ar8mOdFZZn8qR5lCVXbGWQ_dFPvW6fDvCrHR3Q1ysJM';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let session = null;

            return {
                async init() {
                    const { data } = await supabase.auth.getSession();
                    session = data.session;
                    if (session) {
                        document.getElementById('logout-btn').classList.remove('hidden');
                        this.switchPage('home');
                    }
                },

                switchPage(pageId) {
                    if (!session && pageId !== 'auth-page') {
                        alert('로그인이 필요한 서비스입니다.');
                        pageId = 'auth-page';
                    }
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    document.getElementById(pageId).classList.add('active');
                    
                    if (pageId === 'home') this.loadRanking();
                    if (pageId === 'community') this.loadPosts();
                },

                toggleAuth() {
                    document.getElementById('login-form').classList.toggle('hidden');
                    document.getElementById('signup-form').classList.toggle('hidden');
                },

                async handleLogin() {
                    const email = document.getElementById('login-email').value;
                    const password = document.getElementById('login-password').value;
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    
                    if (error) return alert('로그인 실패: ' + error.message);
                    session = data.session;
                    location.reload(); // 세션 반영을 위한 리로드
                },

                async handleSignup() {
                    const email = document.getElementById('signup-email').value;
                    const password = document.getElementById('signup-password').value;
                    const username = document.getElementById('signup-username').value;

                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) return alert(error.message);

                    // profile 테이블에 사용자 정보 추가
                    await supabase.from('profiles').insert([{ id: data.user.id, username, exp: 0 }]);
                    alert('가입 완료! 로그인해 주세요.');
                    this.toggleAuth();
                },

                async handleLogout() {
                    await supabase.auth.signOut();
                    location.reload();
                },

                async loadRanking() {
                    const { data: profiles } = await supabase.from('profiles').select('*').order('exp', { ascending: false }).limit(3);
                    const container = document.getElementById('ranking-list');
                    if (!profiles) return;

                    container.innerHTML = profiles.map((p, i) => `
                        <div class="glass-card p-6 text-center border-t-4 ${i === 0 ? 'border-yellow-400' : 'border-cyan-500'}">
                            <div class="text-4xl mb-2">${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'}</div>
                            <h3 class="text-xl font-bold">${p.username}</h3>
                            <p class="text-cyan-400">${p.exp} EXP</p>
                        </div>
                    `).join('');
                },

                async loadPosts() {
                    const { data: posts, error } = await supabase.from('posts').select(`*, profiles(username)`).order('created_at', { ascending: false });
                    const container = document.getElementById('post-list');
                    if (error) return console.error(error);

                    container.innerHTML = posts.map(post => `
                        <div class="glass-card p-6 hover:bg-white/5 transition">
                            <h3 class="text-xl font-bold mb-2">${post.title}</h3>
                            <p class="text-gray-400 mb-4">${post.content}</p>
                            <div class="flex justify-between items-center text-sm text-gray-500">
                                <span>작성자: ${post.profiles?.username || '익명'}</span>
                                <span>${new Date(post.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                },

                openPostModal() {
                    const title = prompt('제목을 입력하세요');
                    const content = prompt('내용을 입력하세요');
                    if (title && content) this.submitPost(title, content);
                },

                async submitPost(title, content) {
                    const { error } = await supabase.from('posts').insert([
                        { title, content, author_id: session.user.id }
                    ]);
                    if (error) alert('작성 실패: ' + error.message);
                    else this.loadPosts();
                }
            };
        })();

        App.init();
    </script>
</body>

</html>
